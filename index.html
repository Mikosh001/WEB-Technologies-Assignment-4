<!doctype html>

  <meta charset="utf-8">

  <title>Task 0 · Simple Contact Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="page-width header-top">
      <a class="brand" href="index.html">Assignment 4<span>Forms &amp; Validation</span></a>
      <p class="student-name">Berdibek Meiirbek</p>
    </div>
    <nav class="page-width" aria-label="Assignment tasks">
      <ul class="task-links">
          <li><a class="active" aria-current="page" href="index.html">Task 0</a></li>
          <li><a href="html5-validation.html">Task 1</a></li>
          <li><a href="bootstrap-form.html">Task 2</a></li>
          <li><a href="bootstrap-validation.html">Task 3</a></li>
          <li><a href="registration.html">Task 4</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-width main-content">
    <header class="page-heading">
      <p class="part-label">Part 1 · Basic HTML Forms</p>
      <h1>Task 0. Simple Contact Form</h1>
      <p>A contact form with a name, email address, and message.</p>
    </header>
    <section class="form-panel" aria-label="Contact form">
      <form class="basic-form" action="index.html#contact-form" method="get" id="contact-form">
        <div class="basic-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name">
        </div>
        <div class="basic-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email">
        </div>
        <div class="basic-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5"></textarea>
        </div>
        <button class="basic-button" type="submit">Submit</button>
      </form>
    </section>
    <p class="demo-note">Practice form for Assignment 4.</p>
  </main>

  <footer class="site-footer">
    <div class="page-width">Web Technologies · Berdibek Meiirbek</div>
  </footer>
</body>
